<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#28231f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <linearGradient id="icon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#667eea"/>
      <stop offset="100%" stop-color="#764ba2"/>
    </linearGradient>
    <!-- grid pattern for the background -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#3d3530" stroke-width="0.5" opacity="0.4"/>
    </pattern>
  </defs>

  <!-- background -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <!-- accent bar top -->
  <rect y="0" width="1200" height="3" fill="url(#accent)"/>

  <!-- icon circle -->
  <circle cx="140" cy="150" r="44" fill="url(#icon-grad)"/>
  <!-- F letterform -->
  <path d="M 120 122 L 120 178 L 125.5 178 L 125.5 152 L 153 152 L 153 147 L 125.5 147 L 125.5 127.5 L 158 127.5 L 158 122 Z"
        fill="#fff" stroke="#fff" stroke-width="0.4" stroke-linejoin="round"/>
  <!-- decorative dots -->
  <circle cx="162" cy="165" r="2.8" fill="#fff" opacity="0.8"/>
  <circle cx="162" cy="174" r="2.2" fill="#fff" opacity="0.55"/>
  <circle cx="154" cy="170" r="1.8" fill="#fff" opacity="0.65"/>

  <!-- wordmark -->
  <text x="210" y="140" font-family="'DM Serif Display', Georgia, serif" font-size="64" font-weight="700" fill="#f0ead6" letter-spacing="2">
    fable
  </text>

  <!-- tagline -->
  <text x="212" y="172" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="15" fill="#9e8e7e" letter-spacing="1">
    design-system workbench
  </text>

  <!-- tech pills -->
  <g transform="translate(212, 195)">
    <!-- Lit -->
    <rect x="0" y="0" width="48" height="24" rx="4" fill="#3d3530"/>
    <text x="24" y="16" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9e8e7e" text-anchor="middle">Lit 3</text>
    <!-- Vite -->
    <rect x="58" y="0" width="52" height="24" rx="4" fill="#3d3530"/>
    <text x="84" y="16" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9e8e7e" text-anchor="middle">Vite</text>
    <!-- Web Components -->
    <rect x="120" y="0" width="132" height="24" rx="4" fill="#3d3530"/>
    <text x="186" y="16" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#9e8e7e" text-anchor="middle">Web Components</text>
  </g>

  <!-- code snippet decoration (right side) -->
  <g transform="translate(680, 60)" opacity="0.85">
    <!-- terminal window -->
    <rect width="460" height="180" rx="10" fill="#0f0f0f" stroke="#3d3530" stroke-width="1"/>
    <!-- title bar -->
    <rect width="460" height="32" rx="10" fill="#1c1917"/>
    <rect y="22" width="460" height="10" fill="#1c1917"/>
    <!-- window dots -->
    <circle cx="18" cy="16" r="5" fill="#ef4444" opacity="0.8"/>
    <circle cx="36" cy="16" r="5" fill="#f59e0b" opacity="0.8"/>
    <circle cx="54" cy="16" r="5" fill="#16a34a" opacity="0.8"/>
    <!-- filename -->
    <text x="230" y="20" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" fill="#6b7280" text-anchor="middle">main.js</text>

    <!-- code lines -->
    <!-- line numbers -->
    <text x="18" y="58" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#4a4540">1</text>
    <text x="18" y="78" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#4a4540">2</text>
    <text x="18" y="98" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#4a4540">3</text>
    <text x="18" y="118" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#4a4540">4</text>
    <text x="18" y="148" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#4a4540">5</text>
    <text x="18" y="168" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#4a4540">6</text>

    <!-- line 1: import style -->
    <text x="40" y="58" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0ead6"> </tspan><tspan fill="#16a34a">"fable-workbench/style.css"</tspan><tspan fill="#f0ead6">;</tspan>
    </text>
    <!-- line 2: import theme -->
    <text x="40" y="78" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0ead6"> </tspan><tspan fill="#16a34a">"./theme.css"</tspan><tspan fill="#f0ead6">;</tspan>
    </text>
    <!-- line 3: import fable -->
    <text x="40" y="98" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0ead6"> </tspan><tspan fill="#16a34a">"fable-workbench"</tspan><tspan fill="#f0ead6">;</tspan>
    </text>
    <!-- line 4: blank -->
    <!-- line 5: comment -->
    <text x="40" y="118" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5" fill="#6b7280">
      // Your components
    </text>
    <!-- line 6: import component -->
    <text x="40" y="148" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0ead6"> </tspan><tspan fill="#16a34a">"./components/my-button.js"</tspan><tspan fill="#f0ead6">;</tspan>
    </text>
    <!-- line 7: import component -->
    <text x="40" y="168" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="12.5">
      <tspan fill="#7c3aed">import</tspan><tspan fill="#f0ead6"> </tspan><tspan fill="#16a34a">"./components/my-card.js"</tspan><tspan fill="#f0ead6">;</tspan>
    </text>
  </g>

  <!-- accent bar bottom -->
  <rect y="297" width="1200" height="3" fill="url(#accent)"/>
</svg>
